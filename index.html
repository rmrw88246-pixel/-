<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الترجمة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>موقع الترجمة</h1>

                <textarea id="text-to-translate" placeholder="اكتب النص هنا..."></textarea>
            </div>

                    <option value="tl">الفلبينية (Filipino)</option>
                    <option value="fi">الفنلندية (Finnish)</option>

                    <option value="hu">المجرية (Hungarian)</option>
                    <option value="is">الأيسلندية (Icelandic)</option>
                    <option value="ig">الإيجبو (Igbo)</option>
                    <option value="id">الإندونيسية (Indonesian)</option>
                    <option value="ga">الأيرلندية (Irish)</option>
                    <option value="it">الإيطالية (Italian)</option>
                    <option value="ja">اليابانية (Japanese)</option>
                    <option value="jw">الجاوية (Javanese)</option>

                    <option value="mk">المقدونية (Macedonian)</option>
                    <option value="mg">المدغشقرية (Malagasy)</option>

                <button id="translate-btn">ترجم</button>
            </div>
            <div class="output-section">
                <textarea id="translated-text" placeholder="الترجمة..." readonly></textarea>
                <div class="output-controls">
                    <button id="speak-btn" title="نطق النص">🔊</button>
                    <select id="voice-select" title="اختر الصوت"></select>
                </div>
            </div>
        </div>
        <div class="history-container">
            <h2>سجل الترجمات</h2>
            <ul id="history-list">
                <!-- History items will be populated by JS -->
            </ul>
            <button id="clear-history-btn">مسح السجل</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
